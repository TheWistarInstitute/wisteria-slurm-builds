name: Build Slurm RPMs

on:
  workflow_dispatch:
    inputs:
      slurm_version:
        description: "Slurm version to build, e.g. 26.05.3"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-rocky9:
    name: Build Slurm ${{ inputs.slurm_version }} RPMs for Rocky 9
    runs-on: ubuntu-latest

    container:
      image: rockylinux/rockylinux:9.8

    env:
      SLURM_VERSION: ${{ inputs.slurm_version }}

    steps:
      - name: Show build environment
        run: |
          set -euxo pipefail
          cat /etc/os-release
          uname -a

      - name: Update build environment
        run: |
          set -euxo pipefail
          dnf -y update

      - name: Show build environment
        run: |
          set -euxo pipefail
          cat /etc/os-release
          uname -a

      - name: Define Slurm release variables
        run: |
          set -euxo pipefail

          slurm_tag="slurm-${SLURM_VERSION//./-}-1"
          slurm_tarball="slurm-${SLURM_VERSION}.tar.bz2"
          slurm_url="https://github.com/SchedMD/slurm/releases/download/${slurm_tag}/${slurm_tarball}"
          artifact_dir="/tmp/artifacts/slurm-${SLURM_VERSION}-rocky9"

          {
            echo "SLURM_TAG=${slurm_tag}"
            echo "SLURM_TARBALL=${slurm_tarball}"
            echo "SLURM_URL=${slurm_url}"
            echo "ARTIFACT_DIR=${artifact_dir}"
            echo "SLURM_SOURCE_DIR=/tmp/slurm-build/slurm-${SLURM_VERSION}"
          } >> "$GITHUB_ENV"

          echo "Slurm version: ${SLURM_VERSION}"
          echo "Slurm tag:     ${slurm_tag}"
          echo "Slurm URL:     ${slurm_url}"

      - name: Install base build tooling
        run: |
          set -euxo pipefail

          dnf -y install dnf-plugins-core epel-release

          # Rocky/RHEL 9 keeps many development packages in CRB.
          dnf config-manager --set-enabled crb || true

          dnf -y groupinstall "Development Tools"

          dnf -y install \
            rpm-build \
            rpmdevtools \
            createrepo_c \
            wget \
            git \
            tar \
            bzip2 \
            xz \
            gzip \
            findutils \
            which

      - name: Prepare rpmbuild tree
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p /tmp/slurm-build

      - name: Download official Slurm release tarball
        run: |
          set -euxo pipefail

          echo "Downloading ${SLURM_URL}"
          curl -fL "$SLURM_URL" -o "/tmp/slurm-build/${SLURM_TARBALL}"

          test -s "/tmp/slurm-build/${SLURM_TARBALL}"

      - name: Extract Slurm source tarball
        run: |
          set -euxo pipefail
          tar -xjf "/tmp/slurm-build/${SLURM_TARBALL}" -C /tmp/slurm-build
          test -f "${SLURM_SOURCE_DIR}/slurm.spec"
          echo "Found Slurm spec:"
          ls -lh "${SLURM_SOURCE_DIR}/slurm.spec"

      - name: Install Slurm RPM build dependencies
        run: |
          set -euxo pipefail
          # dnf builddep reads BuildRequires from Slurm's RPM spec.
          dnf -y builddep "${SLURM_SOURCE_DIR}/slurm.spec"

      - name: Build Slurm RPMs
        run: |
          set -euxo pipefail
          rpmbuild -ta "/tmp/slurm-build/${SLURM_TARBALL}"

      - name: Collect RPM artifacts
        run: |
          set -euxo pipefail
          mkdir -p "$ARTIFACT_DIR"
          find "$HOME/rpmbuild/RPMS" -type f -name "*.rpm" -exec cp -v {} "$ARTIFACT_DIR/" \;
          find "$HOME/rpmbuild/SRPMS" -type f -name "*.rpm" -exec cp -v {} "$ARTIFACT_DIR/" \;
          cd "$ARTIFACT_DIR"

          if ! ls *.rpm >/dev/null 2>&1; then
            echo "No RPMs were produced."
            exit 1
          fi
          sha256sum *.rpm > SHA256SUMS

          echo "Built RPMs:"
          ls -lh

      - name: Create local DNF repo metadata
        run: |
          set -euxo pipefail

          createrepo_c "$ARTIFACT_DIR"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: slurm-${{ inputs.slurm_version }}-rocky9-rpms
          path: /tmp/artifacts/slurm-${{ inputs.slurm_version }}-rocky9/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: slurm-${{ inputs.slurm_version }}-rocky9
          name: "Slurm ${{ inputs.slurm_version }} RPMs for Rocky 9"
          body: |
            Slurm ${{ inputs.slurm_version }} RPMs built for Rocky Linux 9.

            Source tarball:
            ${{ env.SLURM_URL }}

            Upstream Slurm release tag:
            ${{ env.SLURM_TAG }}

            This release includes:
            - Binary RPMs
            - Source RPM
            - SHA256SUMS
            - DNF repository metadata

            Built by GitHub Actions.
          files: /tmp/artifacts/slurm-${{ inputs.slurm_version }}-rocky9/*
